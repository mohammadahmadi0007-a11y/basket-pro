<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BASKET PRO | بسکتبال رکوردی</title>
  <script src="https://tapi.bale.ai/miniapp.js?3"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: Tahoma, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #3d060c;
    }
    #gameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }
    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(15, 2, 4, 0.75), rgba(15, 2, 4, 0));
    }
    .score-display {
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      direction: ltr;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .hud-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      background: rgba(20, 4, 8, 0.65);
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .hint-pill {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 2, 4, 0.72);
      border: 1px solid rgba(255, 190, 11, 0.4);
      color: #ffdd67;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      z-index: 9;
      pointer-events: none;
      white-space: nowrap;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 3, 6, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 30;
      color: #fff;
    }
    .hidden {
      display: none !important;
    }
    .banner-title {
      width: 100%;
      max-width: 380px;
      background: #d93848;
      color: #fff;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      letter-spacing: 1px;
    }
    .stats-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 12px;
    }
    .stat-box {
      flex: 1;
      background: rgba(48, 8, 14, 0.96);
      border: 1px solid rgba(255, 190, 11, 0.3);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }
    .stat-val {
      font-size: 26px;
      font-weight: 900;
      color: #ffbe0b;
    }
    .stat-lbl {
      font-size: 11px;
      color: #f3c6cb;
      margin-top: 2px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(42, 7, 13, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #ffbe0b;
      font-weight: bold;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 195px;
      overflow-y: auto;
    }
    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 13px;
    }
    .rank-item.me {
      background: rgba(46, 204, 113, 0.25);
      border: 1px solid #2ecc71;
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ff6b35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .score-pill {
      font-weight: 900;
      color: #ffbe0b;
      font-size: 15px;
    }
    .guest-note {
      font-size: 11px;
      color: #ffb703;
      text-align: center;
      margin-top: 8px;
      background: rgba(255, 183, 3, 0.14);
      padding: 6px;
      border-radius: 8px;
    }
    .btn {
      width: 100%;
      max-width: 380px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 9px;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: #fff;
    }
    .btn-share {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 14px;
    }
    .channel-tag {
      margin-top: 2px;
      font-size: 12px;
      color: #e0aeb4;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="top-hud">
    <div class="score-display">Score: <span id="hudScore">0</span></div>
    <div class="hud-actions">
      <button class="hud-btn" type="button" onclick="openRankModal()" title="جدول برترین‌ها">🏆</button>
      <button class="hud-btn" id="soundToggle" type="button" onclick="toggleSound()" title="صدا">🔊</button>
    </div>
  </div>

  <div class="hint-pill" id="hintPill">انگشتت رو بکش و رها کن تا شوت بزنی 🏀</div>
  <canvas id="gameCanvas"></canvas>

  <!-- پنجره رنکینگ در حین بازی -->
  <div id="rankModal" class="overlay hidden">
    <div class="banner-title" style="font-size:22px;">🏆 برترین بازیکنان</div>
    <div class="card">
      <div class="card-header">
        <span>جدول رنکینگ</span>
        <span id="modalRankBadge">رتبه شما: -</span>
      </div>
      <div class="rank-list" id="modalRankList"></div>
      <div id="guestWarnModal" class="guest-note hidden">
        ⚠️ برای ثبت رکورد، از دکمه کانال بله وارد شوید.
      </div>
    </div>
    <button class="btn btn-primary" type="button" onclick="closeRankModal()">ادامه بازی</button>
  </div>

  <!-- صفحه پایان بازی -->
  <div id="gameOverScreen" class="overlay hidden">
    <div class="banner-title">TIME'S UP! ⏱️</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="finalScore" style="color:#2ecc71;">0</div>
        <div class="stat-lbl">امتیاز شما</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="bestScore">0</div>
        <div class="stat-lbl">بهترین رکورد</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>🏆 جدول نفرات برتر</span>
        <span id="myRankBadgeEnd">رتبه شما: -</span>
      </div>
      <div class="rank-list" id="endRankList"></div>
      <div id="guestWarningEnd" class="guest-note hidden">
        ⚠️ امتیاز مهمان در جدول عمومی ثبت نمی‌شود.
      </div>
    </div>

    <button class="btn btn-primary" type="button" onclick="resetGame()">🔄 بازی مجدد</button>
    <button class="btn btn-share" type="button" onclick="shareRecord()">📤 کل‌کل و ارسال رکورد به دوستان</button>
    <div class="channel-tag">🎮 اختصاصی کانال @gamee_balee</div>
  </div>

  <script>
    if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }

    var memStore = {};
    function safeGet(k) {
      try { return window.localStorage.getItem(k); } catch (e) { return memStore[k] || null; }
    }
    function safeSet(k, v) {
      memStore[k] = v;
      try { window.localStorage.setItem(k, v); } catch (e) {}
    }

    // ==========================================
    // ۱. تنظیمات اختصاصی ربات و استاندارد بله
    // ==========================================
    var BOT_USERNAME = "basket_pro_game_bot";
    var CHANNEL_ID = "@gamee_balee";
    var LEADERBOARD_API_URL = "";

    var webapp = (window.Bale && window.Bale.WebApp) || (window.Telegram && window.Telegram.WebApp) || null;
    if (webapp) {
      try { webapp.ready(); webapp.expand(); } catch (e) {}
    }

    var rawUser = webapp && webapp.initDataUnsafe && webapp.initDataUnsafe.user ? webapp.initDataUnsafe.user : null;
    var isAuthenticated = Boolean(rawUser && rawUser.id);
    var currentUser = isAuthenticated
      ? {
          id: String(rawUser.id),
          name: [rawUser.first_name, rawUser.last_name].filter(Boolean).join(" ") || rawUser.username || "بازیکن بله",
          photo: rawUser.photo_url || ""
        }
      : { id: "guest", name: "بازیکن مهمان", photo: "" };

    var STORAGE_KEY = "basket_pro_leaderboard_v2";
    var LOCAL_BEST_KEY = "basket_pro_my_best_v2";

    function getLocalBest() { return Number(safeGet(LOCAL_BEST_KEY) || 0); }
    function setLocalBest(val) { if (val > getLocalBest()) safeSet(LOCAL_BEST_KEY, String(val)); }

    async function loadLeaderboard() {
      if (LEADERBOARD_API_URL) {
        try {
          var res = await fetch(LEADERBOARD_API_URL);
          if (res.ok) {
            var data = await res.json();
            if (Array.isArray(data)) return data;
          }
        } catch (e) {}
      }
      try {
        var raw = JSON.parse(safeGet(STORAGE_KEY) || "[]");
        return Array.isArray(raw) ? raw.filter(function(item) { return item && item.id && item.id !== "guest"; }) : [];
      } catch (e) { return []; }
    }

    async function submitScore(newScore) {
      setLocalBest(newScore);
      if (!isAuthenticated || newScore <= 0) return;
      if (LEADERBOARD_API_URL) {
        try {
          await fetch(LEADERBOARD_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: currentUser.id, name: currentUser.name, photo: currentUser.photo, score: newScore })
          });
        } catch (e) {}
      }
      var list = await loadLeaderboard();
      var idx = list.findIndex(function(u) { return String(u.id) === currentUser.id; });
      if (idx >= 0) {
        if (newScore > list[idx].score) {
          list[idx].score = newScore;
          list[idx].name = currentUser.name;
          list[idx].photo = currentUser.photo;
        }
      } else {
        list.push({ id: currentUser.id, name: currentUser.name, photo: currentUser.photo, score: newScore });
      }
      list.sort(function(a, b) { return b.score - a.score; });
      safeSet(STORAGE_KEY, JSON.stringify(list.slice(0, 30)));
    }

    async function renderLeaderboard(listElId, badgeElId, guestWarnId) {
      var listEl = document.getElementById(listElId);
      var badgeEl = document.getElementById(badgeElId);
      var guestWarn = document.getElementById(guestWarnId);
      if (!listEl || !badgeEl) return;

      if (guestWarn) {
        if (!isAuthenticated) guestWarn.classList.remove("hidden");
        else guestWarn.classList.add("hidden");
      }

      var list = await loadLeaderboard();
      list.sort(function(a, b) { return b.score - a.score; });

      if (isAuthenticated) {
        var myIdx = list.findIndex(function(u) { return String(u.id) === currentUser.id; });
        badgeEl.textContent = myIdx >= 0 ? "رتبه شما: #" + (myIdx + 1) : "رتبه شما: ثبت نشده";
      } else {
        badgeEl.textContent = "حالت مهمان";
      }

      if (list.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;color:#cfa5aa;font-size:12px;padding:12px;">هنوز رکوردی ثبت نشده! اولین نفر باش 🏀</div>';
        return;
      }

      var medals = ["🥇", "🥈", "🥉"];
      listEl.innerHTML = list.slice(0, 10).map(function(item, i) {
        var isMe = isAuthenticated && String(item.id) === currentUser.id;
        var rankIcon = medals[i] || ("#" + (i + 1));
        var initial = (item.name || "ب").trim().charAt(0);
        var avatarHtml = item.photo ? '<img src="' + item.photo + '" alt="" />' : '<span>' + initial + '</span>';
        return '<div class="rank-item ' + (isMe ? "me" : "") + '">' +
          '<div class="player-info">' +
          '<span style="min-width:24px;font-weight:bold;">' + rankIcon + '</span>' +
          '<div class="avatar">' + avatarHtml + '</div>' +
          '<span>' + item.name + '</span>' +
          '</div>' +
          '<span class="score-pill">' + item.score + '</span>' +
          '</div>';
      }).join("");
    }

    function openRankModal() {
      renderLeaderboard("modalRankList", "modalRankBadge", "guestWarnModal");
      document.getElementById("rankModal").classList.remove("hidden");
    }
    function closeRankModal() {
      document.getElementById("rankModal").classList.add("hidden");
    }

    // ==========================================
    // ۲. موتور صدای واقعی زنجیر فلزی (Web Audio API)
    // ==========================================
    var audioCtx = null;
    var soundEnabled = true;
    var lastChainClinkTime = 0;

    function initAudio() {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("soundToggle").textContent = soundEnabled ? "🔊" : "🔇";
    }

    function playThrowSound() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(340, audioCtx.currentTime + 0.12);
        g.gain.setValueAtTime(0.16, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.13);
      } catch (e) {}
    }

    function playRimSound() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(210, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(72, audioCtx.currentTime + 0.11);
        g.gain.setValueAtTime(0.35, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    // صدای واقعی ساییده شدن و برخورد حلقه‌های زنجیر فلزی (Metallic Chain Rattle)
    function playChainRattle(intensity) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      var now = audioCtx.currentTime;
      if (now - lastChainClinkTime < 0.08) return;
      lastChainClinkTime = now;

      try {
        var vol = Math.min(1, Math.max(0.25, intensity || 0.8));
        var duration = 0.34;
        var sampleRate = audioCtx.sampleRate;
        var totalSamples = Math.floor(sampleRate * duration);

        // ساخت بافر صدای برخوردهای ریز و پی‌درپی حلقه‌های زنجیر به هم
        var buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
        var data = buffer.getChannelData(0);

        // ۲۲ ضربه میکروسکوپی فلزی در طول ۰.۳۴ ثانیه برای شبیه‌سازی صدای زنجیر واقعی
        var clinkCount = 22;
        for (var c = 0; c < clinkCount; c++) {
          var startSample = Math.floor((c / clinkCount) * totalSamples * 0.78 + Math.random() * 140);
          var clinkLen = Math.floor(sampleRate * (0.012 + Math.random() * 0.018));
          var clinkAmp = (1 - c / (clinkCount * 1.15)) * (0.55 + Math.random() * 0.45);
          // فرکانس تشدید فلزی حلقه زنجیر
          var f1 = 3100 + Math.random() * 2600;
          var f2 = 5400 + Math.random() * 3200;

          for (var s = 0; s < clinkLen && (startSample + s) < totalSamples; s++) {
            var t = s / sampleRate;
            var env = Math.exp(-t * 210);
            var noise = (Math.random() * 2 - 1) * 0.65;
            var ring = Math.sin(2 * Math.PI * f1 * t) * 0.45 + Math.sin(2 * Math.PI * f2 * t) * 0.35;
            data[startSample + s] += (noise + ring) * env * clinkAmp;
          }
        }

        var source = audioCtx.createBufferSource();
        source.buffer = buffer;

        // فیلتر بالاگذر و میان‌گذر برای جنس صدای فولاد و زنجیر
        var hpFilter = audioCtx.createBiquadFilter();
        hpFilter.type = "highpass";
        hpFilter.frequency.value = 1800;

        var peakFilter = audioCtx.createBiquadFilter();
        peakFilter.type = "peaking";
        peakFilter.frequency.value = 4200;
        peakFilter.Q.value = 2.2;
        peakFilter.gain.value = 7;

        var masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.55 * vol, now);
        masterGain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        source.connect(hpFilter);
        hpFilter.connect(peakFilter);
        peakFilter.connect(masterGain);
        masterGain.connect(audioCtx.destination);
        source.start(now);
      } catch (e) {}
    }

    // صدای گل شدن: برخورد کامل با ۴ رشته زنجیر + تشویق تماشاچی‌ها
    function playScoreWithChainAndCrowd(isClean) {
      playChainRattle(1.0);
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        var now = audioCtx.currentTime;
        var clen = Math.floor(audioCtx.sampleRate * 0.65);
        var cbuf = audioCtx.createBuffer(1, clen, audioCtx.sampleRate);
        var cd = cbuf.getChannelData(0);
        for (var j = 0; j < clen; j++) {
          var env = Math.sin(Math.min(1, j / (audioCtx.sampleRate * 0.1)) * Math.PI * 0.5) * Math.exp(-j / (audioCtx.sampleRate * 0.26));
          cd[j] = (Math.random() * 2 - 1) * env;
        }
        var csrc = audioCtx.createBufferSource();
        csrc.buffer = cbuf;
        var cflt = audioCtx.createBiquadFilter();
        cflt.type = "lowpass";
        cflt.frequency.value = isClean ? 1350 : 920;
        var cg = audioCtx.createGain();
        cg.gain.setValueAtTime(isClean ? 0.28 : 0.18, now + 0.04);
        cg.gain.exponentialRampToValueAtTime(0.005, now + 0.64);
        csrc.connect(cflt); cflt.connect(cg); cg.connect(audioCtx.destination);
        csrc.start(now + 0.04);
      } catch (e) {}
    }

    function playBuzzer() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(95, audioCtx.currentTime + 0.8);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.85);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.85);
      } catch (e) {}
    }

    // ==========================================
    // ۳. موتور گرافیک و فیزیک ۴ رشته زنجیر مشکی
    // ==========================================
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");

    var W = window.innerWidth || 360;
    var H = window.innerHeight || 640;
    var dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth || 360;
      H = window.innerHeight || 640;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    var gameState = "READY";
    var score = 0;
    var timeLeft = 21.0;
    var lastTime = 0;

    var windDir = 1;
    var windLevel = 1;

    function courtFloorY() { return H * 0.765; }
    function playerX() { return Math.max(46, W * 0.115); }
    function handPos() {
      var jumpOff = Math.sin(playerJump * Math.PI) * 18;
      return { x: playerX() + 14, y: courtFloorY() - 56 - jumpOff };
    }

    // فیزیک مستقل برای ۴ شاخه زنجیر مشکی آویزان زیر حلقه
    var chainStrands = [
      { angle: 0, vel: 0 },
      { angle: 0, vel: 0 },
      { angle: 0, vel: 0 },
      { angle: 0, vel: 0 }
    ];

    var hoop = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      boardW: 94,
      boardH: 64,
      rimRx: 21,
      rimRy: 5,
      chainLength: 29
    };

    var activeBalls = [];
    var hasBallInHand = true;
    var reloadTimer = 0;
    var playerJump = 0;

    var isDragging = false;
    var dragStart = { x: 0, y: 0 };
    var dragCurr = { x: 0, y: 0 };
    var aimVx = 0;
    var aimVy = 0;
    var aimFlightT = 0.86;

    var popups = [];
    var flashes = [];
    var crowdRows = [];

    function buildCrowd() {
      crowdRows = [];
      var step = 20;
      var count = Math.ceil(W / step) + 3;
      var colors = ["#570c14", "#660f18", "#75121d", "#4a0910"];
      for (var r = 0; r < 4; r++) {
        for (var c = 0; c < count; c++) {
          crowdRows.push({
            x: c * step + (r % 2) * 10 - 10,
            y: H * 0.44 + r * 22,
            r: 8.5 + (r * 0.4),
            color: colors[r % colors.length],
            phase: Math.random() * Math.PI * 2
          });
        }
      }
    }
    buildCrowd();
    window.addEventListener("resize", buildCrowd);

    function pickNextHoopSpot() {
      var minX = Math.max(150, W * 0.34);
      var maxX = Math.min(W - 65, W * 0.72);
      var minY = H * 0.27;
      var maxY = H * 0.46;

      var nx = minX + Math.random() * (maxX - minX);
      var ny = minY + Math.random() * (maxY - minY);

      if (Math.hypot(nx - hoop.x, ny - hoop.y) < 48) {
        nx = hoop.x > (minX + maxX) * 0.5 ? minX + 18 : maxX - 18;
      }
      hoop.targetX = nx;
      hoop.targetY = ny;
    }

    function randomizeWindAfterShot() {
      var prevDir = windDir;
      var prevLevel = windLevel;
      windDir = Math.random() < 0.5 ? -1 : 1;
      windLevel = Math.floor(Math.random() * 3) + 1;
      if (windDir === prevDir && windLevel === prevLevel) {
        windLevel = (prevLevel % 3) + 1;
      }
    }

    function resetGame() {
      score = 0;
      timeLeft = 21.0;
      windDir = 1;
      windLevel = 1;
      activeBalls = [];
      popups = [];
      hasBallInHand = true;
      reloadTimer = 0;
      playerJump = 0;
      hoop.x = W * 0.36;
      hoop.y = H * 0.36;
      hoop.targetX = hoop.x;
      hoop.targetY = hoop.y;
      for (var c = 0; c < 4; c++) {
        chainStrands[c].angle = 0;
        chainStrands[c].vel = 0;
      }
      gameState = "READY";
      document.getElementById("hudScore").textContent = "0";
      document.getElementById("gameOverScreen").classList.add("hidden");
      document.getElementById("hintPill").classList.remove("hidden");
    }

    async function triggerGameOver() {
      gameState = "GAMEOVER";
      isDragging = false;
      playBuzzer();
      await submitScore(score);
      document.getElementById("finalScore").textContent = String(score);
      document.getElementById("bestScore").textContent = String(Math.max(score, getLocalBest()));
      await renderLeaderboard("endRankList", "myRankBadgeEnd", "guestWarningEnd");
      document.getElementById("gameOverScreen").classList.remove("hidden");
    }

    function spawnPopup(lines, x, y) {
      popups.push({ lines: lines, x: x, y: y, life: 1.0 });
    }

    function computeAim() {
      var dx = dragCurr.x - dragStart.x;
      var dy = dragCurr.y - dragStart.y;
      var dist = Math.hypot(dx, dy);
      if (dist < 10) {
        aimVx = 0;
        aimVy = 0;
        return;
      }

      var targetOffsetX = 0;
      var arcHeightBoost = 0;

      if (dx > 12 || dy < -12) {
        targetOffsetX = (dx - 85) * 1.5;
        arcHeightBoost = Math.max(0, -dy) * 0.65;
      } else {
        targetOffsetX = (-dx - 85) * 1.5;
        arcHeightBoost = Math.max(0, dy) * 0.65;
      }

      var hp = handPos();
      var aimTargetX = hoop.targetX + Math.max(-170, Math.min(220, targetOffsetX));
      var aimTargetY = hoop.targetY + 4;

      aimFlightT = 0.86;
      var gravity = 980;
      aimVx = (aimTargetX - hp.x) / aimFlightT;
      aimVy = (aimTargetY - hp.y - 0.5 * gravity * aimFlightT * aimFlightT) / aimFlightT - arcHeightBoost * 0.35;
      if (aimVy > -380) aimVy = -380;
    }

    function getPos(e) {
      var t = (e.touches && e.touches.length) ? e.touches[0] : e;
      return { x: t.clientX, y: t.clientY };
    }

    function handleStart(e) {
      if (gameState === "GAMEOVER") return;
      if (!document.getElementById("rankModal").classList.contains("hidden")) return;
      initAudio();
      if (gameState === "READY") {
        gameState = "PLAYING";
        document.getElementById("hintPill").classList.add("hidden");
      }
      if (!hasBallInHand) return;
      isDragging = true;
      dragStart = getPos(e);
      dragCurr = { x: dragStart.x, y: dragStart.y };
      var hp = handPos();
      aimFlightT = 0.86;
      aimVx = (hoop.x - hp.x) / aimFlightT;
      aimVy = (hoop.y - hp.y - 0.5 * 980 * aimFlightT * aimFlightT) / aimFlightT;
    }

    function handleMove(e) {
      if (!isDragging) return;
      dragCurr = getPos(e);
      computeAim();
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;
      if (!hasBallInHand || gameState !== "PLAYING") return;
      if (Math.hypot(aimVx, aimVy) < 120) return;

      var hp = handPos();
      var initialSpin = -5.0 + (windDir * windLevel * 1.4);

      activeBalls.push({
        x: hp.x,
        y: hp.y,
        vx: aimVx,
        vy: aimVy,
        prevY: hp.y,
        r: 15,
        rot: 0,
        spinSpeed: initialSpin,
        age: 0,
        scored: false,
        touchedRim: false,
        fallingThroughNet: false,
        shotWindDir: windDir,
        shotWindLevel: windLevel,
        windChangedForThisShot: false,
        touchedChain: false
      });

      hasBallInHand = false;
      reloadTimer = 0.28;
      playerJump = 1.0;
      playThrowSound();
    }

    canvas.addEventListener("pointerdown", handleStart);
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleEnd);
    window.addEventListener("pointercancel", handleEnd);
    canvas.addEventListener("touchstart", handleStart, { passive: true });
    window.addEventListener("touchmove", handleMove, { passive: true });
    window.addEventListener("touchend", handleEnd);

    // موقعیت افقی اتصال ۴ شاخه زنجیر مشکی روی حلقه
    function getChainAnchorX(index) {
      var offsets = [-14, -5, 5, 14];
      return hoop.x + offsets[index];
    }

    // ==========================================
    // ۴. به‌روزرسانی منطق بازی و فیزیک زنجیرها
    // ==========================================
    function update(dt) {
      if (Math.random() < 0.08) {
        flashes.push({
          x: Math.random() * W,
          y: H * (0.43 + Math.random() * 0.22),
          life: 1.0
        });
      }
      flashes.forEach(function(f) { f.life -= dt * 4.2; });
      flashes = flashes.filter(function(f) { return f.life > 0; });

      popups.forEach(function(p) {
        p.y -= 28 * dt;
        p.life -= dt * 0.9;
      });
      popups = popups.filter(function(p) { return p.life > 0; });

      if (playerJump > 0) playerJump = Math.max(0, playerJump - dt * 3.8);

      if (!hasBallInHand) {
        reloadTimer -= dt;
        if (reloadTimer <= 0) hasBallInHand = true;
      }

      var prevHoopX = hoop.x;
      hoop.x += (hoop.targetX - hoop.x) * Math.min(1, dt * 10);
      hoop.y += (hoop.targetY - hoop.y) * Math.min(1, dt * 10);
      var hoopMoveVx = (hoop.x - prevHoopX) / Math.max(0.001, dt);

      // فیزیک آونگ طبیعی برای هر یک از ۴ شاخه زنجیر مشکی
      for (var c = 0; c < 4; c++) {
        var st = chainStrands[c];
        // نیروی بازگرداننده گرانش + میرایی طبیعی زنجیر فلزی
        var springAcc = -48 * st.angle - 5.2 * st.vel - (hoopMoveVx * 0.012);
        st.vel += springAcc * dt;
        st.angle += st.vel * dt;
        // محدود کردن زاویه چرخش زنجیر تا طبیعی بماند
        if (st.angle > 0.75) { st.angle = 0.75; st.vel *= -0.3; }
        if (st.angle < -0.75) { st.angle = -0.75; st.vel *= -0.3; }
      }

      if (gameState === "PLAYING") {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          triggerGameOver();
          return;
        }
      }

      var gravity = 980;
      var rimY = hoop.y + 10;

      for (var i = activeBalls.length - 1; i >= 0; i--) {
        var b = activeBalls[i];
        b.age += dt;
        b.prevY = b.y;

        var windForce = b.shotWindDir * b.shotWindLevel * 32;
        b.vx += windForce * dt;
        b.vy += gravity * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        b.spinSpeed += (b.shotWindDir * b.shotWindLevel * 1.6) * dt;
        b.rot += b.spinSpeed * dt;

        var leftRimX = hoop.x - hoop.rimRx;
        var rightRimX = hoop.x + hoop.rimRx;

        // برخورد با لبه‌های حلقه
        if (!b.scored && b.vy > 0 && Math.abs(b.y - rimY) < 13) {
          var distL = Math.hypot(b.x - leftRimX, b.y - rimY);
          var distR = Math.hypot(b.x - rightRimX, b.y - rimY);

          if (distL < 9) {
            b.touchedRim = true;
            b.vx = Math.abs(b.vx) * 0.45 + 35;
            b.vy = -Math.abs(b.vy) * 0.45;
            b.spinSpeed = 6;
            playRimSound();
          } else if (distR < 9) {
            b.touchedRim = true;
            b.vx = -Math.abs(b.vx) * 0.45 - 35;
            b.vy = -Math.abs(b.vy) * 0.45;
            b.spinSpeed = -6;
            playRimSound();
          }
        }

        // برخورد فیزیکی توپ با ۴ شاخه زنجیر مشکی (چه هنگام گل شدن چه هنگام تماس از زیر/کنار)
        if (b.y > rimY - 4 && b.y < rimY + hoop.chainLength + 10) {
          for (var s = 0; s < 4; s++) {
            var anchorX = getChainAnchorX(s);
            var strandTipX = anchorX + Math.sin(chainStrands[s].angle) * hoop.chainLength;
            var strandMidX = (anchorX + strandTipX) * 0.5;
            var dxChain = strandMidX - b.x;

            if (Math.abs(dxChain) < b.r + 4) {
              // زنجیر به سمت مخالف توپ کنار می‌رود (باز شدن زنجیرها هنگام عبور توپ)
              var pushDir = dxChain >= 0 ? 1 : -1;
              if (Math.abs(dxChain) < 2) pushDir = s < 2 ? -1 : 1;

              chainStrands[s].vel += pushDir * 14.5 * dt * 60;
              // اصطکاک ملایم زنجیر روی سرعت افقی توپ
              b.vx *= (1 - 1.8 * dt);

              if (!b.touchedChain) {
                b.touchedChain = true;
                playChainRattle(0.75);
              }
            }
          }
        }

        // تشخیص گل شدن
        if (
          !b.scored &&
          b.vy > 0 &&
          b.prevY <= rimY &&
          b.y >= rimY &&
          b.x >= leftRimX + 2 &&
          b.x <= rightRimX - 2
        ) {
          b.scored = true;
          b.fallingThroughNet = true;
          b.vx *= 0.22;
          b.x = hoop.x + (b.x - hoop.x) * 0.35;
          score += 1;
          document.getElementById("hudScore").textContent = String(score);

          // باز شدن طبیعی ۴ رشته زنجیر به بیرون هنگام عبور توپ از دهانه حلقه
          chainStrands[0].vel -= 9.5;
          chainStrands[1].vel -= 5.2;
          chainStrands[2].vel += 5.2;
          chainStrands[3].vel += 9.5;

          var isClean = !b.touchedRim;
          var addSec = isClean ? 6 : 3;
          timeLeft = Math.min(60, timeLeft + addSec);
          playScoreWithChainAndCrowd(isClean);

          if (isClean) {
            spawnPopup(["+" + addSec + " SEC", "CLEAN", "SHOT"], hoop.x + 56, hoop.y + 8);
          } else {
            spawnPopup(["+" + addSec + " SEC"], hoop.x + 58, hoop.y + 12);
          }

          pickNextHoopSpot();
          if (!b.windChangedForThisShot) {
            b.windChangedForThisShot = true;
            randomizeWindAfterShot();
          }
        }

        var floor = courtFloorY() - 8;
        if (b.y > floor) {
          b.y = floor;
          if (!b.windChangedForThisShot) {
            b.windChangedForThisShot = true;
            randomizeWindAfterShot();
          }
          if (Math.abs(b.vy) > 90) {
            b.vy = -b.vy * 0.52;
            b.vx *= 0.78;
            b.spinSpeed = b.vx * 0.06;
          } else {
            b.vy = 0;
            b.vx *= 0.92;
            b.spinSpeed = b.vx * 0.06;
          }
        }

        if (b.age > 3.2 || b.x < -80 || b.x > W + 80) {
          if (!b.windChangedForThisShot) {
            b.windChangedForThisShot = true;
            randomizeWindAfterShot();
          }
          activeBalls.splice(i, 1);
        }
      }
    }

    // ==========================================
    // ۵. رندر صحنه و ۴ رشته زنجیر مشکی
    // ==========================================
    function drawArenaBackground() {
      var grad = ctx.createLinearGradient(0, 0, 0, courtFloorY());
      grad.addColorStop(0, "#47070e");
      grad.addColorStop(0.45, "#8f0e1c");
      grad.addColorStop(1, "#5c0912");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, courtFloorY());

      ctx.fillStyle = "#520911";
      ctx.fillRect(0, 0, W, H * 0.14);
      ctx.strokeStyle = "#3b050b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.14);
      ctx.lineTo(W, H * 0.14);
      for (var tx = 0; tx < W; tx += 70) {
        ctx.moveTo(tx, 10);
        ctx.lineTo(tx + 35, H * 0.14);
        ctx.lineTo(tx + 70, 10);
      }
      ctx.stroke();

      var now = performance.now() * 0.005;
      var anyChainMoving = Math.abs(chainStrands[0].vel) > 0.4 || Math.abs(chainStrands[3].vel) > 0.4;
      crowdRows.forEach(function(c) {
        var cheer = anyChainMoving ? Math.sin(now * 3 + c.phase) * 4 : Math.sin(now + c.phase) * 1;
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x, c.y + cheer, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(c.x - c.r - 1, c.y + c.r - 1 + cheer, (c.r + 1) * 2, 18, 6);
        ctx.fill();
      });

      flashes.forEach(function(f) {
        ctx.save();
        ctx.globalAlpha = f.life;
        var rad = 18 * f.life;
        var rg = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, rad);
        rg.addColorStop(0, "#ffffff");
        rg.addColorStop(0.4, "rgba(255,255,255,0.6)");
        rg.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(f.x, f.y, rad, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(f.x - rad * 1.4, f.y);
        ctx.lineTo(f.x + rad * 1.4, f.y);
        ctx.stroke();
        ctx.restore();
      });

      var adH = 34;
      var adY = courtFloorY() - adH;
      ctx.fillStyle = "#1956a8";
      ctx.fillRect(0, adY, W, adH);

      var panelW = 148;
      for (var px = 0; px < W + panelW; px += panelW) {
        ctx.strokeStyle = "#8aa8d6";
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 2, adY + 2, panelW - 4, adH - 4);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(px + 52, adY + 4, panelW - 56, adH - 8);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 15px Tahoma";
        ctx.fillText("O₂", px + 18, adY + 23);

        ctx.fillStyle = "#1956a8";
        ctx.font = "900 14px Tahoma";
        ctx.fillText("SPORT", px + 64, adY + 23);
      }

      var floorTop = courtFloorY();
      var fGrad = ctx.createLinearGradient(0, floorTop, 0, H);
      fGrad.addColorStop(0, "#d46a22");
      fGrad.addColorStop(0.35, "#b85416");
      fGrad.addColorStop(1, "#6e2b08");
      ctx.fillStyle = fGrad;
      ctx.fillRect(0, floorTop, W, H - floorTop);

      ctx.strokeStyle = "rgba(255, 220, 180, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, floorTop + 14);
      ctx.lineTo(W, floorTop + 14);
      ctx.stroke();

      ctx.fillStyle = "#36070c";
      for (var sx = 20; sx < W; sx += 95) {
        ctx.beginPath();
        ctx.arc(sx, H - 18, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(sx - 34, H - 6, 68, 30, 14);
        ctx.fill();
      }
    }

    function drawWallScoreboardAndWind() {
      var sbW = Math.min(138, W * 0.36);
      var sbTop = H * 0.19;
      var sbH = 122;

      ctx.save();
      ctx.fillStyle = "#c92a38";
      ctx.beginPath();
      ctx.moveTo(0, sbTop);
      ctx.lineTo(sbW, sbTop + 8);
      ctx.lineTo(sbW - 6, sbTop + sbH - 6);
      ctx.lineTo(0, sbTop + sbH);
      ctx.closePath();
      ctx.fill();

      var ledX = 14;
      var ledY = sbTop + 34;
      var ledW = sbW - 34;
      var ledH = 44;

      ctx.fillStyle = "#7a0c16";
      ctx.strokeStyle = "#f2b8be";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(ledX, ledY, ledW, ledH, 4);
      ctx.fill();
      ctx.stroke();

      var secVal = String(Math.ceil(timeLeft));
      ctx.fillStyle = timeLeft <= 5 ? "#ffea00" : "#ffffff";
      ctx.font = "900 30px monospace";
      ctx.textAlign = "center";
      ctx.fillText(secVal, ledX + ledW / 2, ledY + 32);

      var arrowY = ledY + ledH + 17;
      var centerX = ledX + ledW / 2;
      for (var i = 0; i < 3; i++) {
        var isLit = false;
        if (windLevel > 0) {
          if (windDir === 1) isLit = i < windLevel;
          else isLit = (2 - i) < windLevel;
        }
        ctx.fillStyle = isLit ? "#ffcf24" : "rgba(90, 8, 16, 0.45)";
        var ax = centerX + (i - 1) * 20;
        ctx.beginPath();
        if (windDir === 1) {
          ctx.moveTo(ax - 6, arrowY - 6);
          ctx.lineTo(ax + 6, arrowY);
          ctx.lineTo(ax - 6, arrowY + 6);
        } else {
          ctx.moveTo(ax + 6, arrowY - 6);
          ctx.lineTo(ax - 6, arrowY);
          ctx.lineTo(ax + 6, arrowY + 6);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBackboard() {
      var bx = hoop.x - hoop.boardW / 2;
      var by = hoop.y - hoop.boardH / 2;

      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.fillRect(bx + 4, by + 5, hoop.boardW, hoop.boardH);

      var boardGrad = ctx.createLinearGradient(bx, by, bx, by + hoop.boardH);
      boardGrad.addColorStop(0, "#d4cfd9");
      boardGrad.addColorStop(1, "#beb8c4");
      ctx.fillStyle = boardGrad;
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.rect(bx, by, hoop.boardW, hoop.boardH);
      ctx.fill();
      ctx.stroke();

      var sqW = 34;
      var sqH = 26;
      ctx.strokeStyle = "#18181b";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(hoop.x - sqW / 2, hoop.y - 16, sqW, sqH);
    }

    // رسم ۴ شاخه زنجیر مشکی آویزان و حلقه نارنجی
    function drawChainsAndRim() {
      var rimY = hoop.y + 10;
      var linksCount = 6;
      var linkStep = hoop.chainLength / linksCount;

      // رسم ۴ شاخه زنجیر مشکی آویزان با انحنای طبیعی هنگام برخورد توپ
      for (var s = 0; s < 4; s++) {
        var anchorX = getChainAnchorX(s);
        var ang = chainStrands[s].angle;

        for (var l = 0; l < linksCount; l++) {
          // هر حلقه پایین‌تر کمی بیشتر انحنا می‌گیرد تا حرکت زنجیر نرم و شلاقی باشد
          var ratio = (l + 0.6) / linksCount;
          var bend = ang * (0.65 + 0.55 * ratio);
          var dist = (l + 0.5) * linkStep;
          var lx = anchorX + Math.sin(bend) * dist;
          var ly = rimY + 2 + Math.cos(bend) * dist;

          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(-bend);

          // بدنه حلقه زنجیر مشکی
          ctx.strokeStyle = "#0d0d10";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          if (l % 2 === 0) {
            ctx.ellipse(0, 0, 1.8, 3.1, 0, 0, Math.PI * 2);
          } else {
            ctx.ellipse(0, 0, 2.3, 2.2, 0, 0, Math.PI * 2);
          }
          ctx.stroke();

          // هایلایت ظریف تیره روی زنجیر مشکی برای تفکیک حلقه‌ها
          ctx.strokeStyle = "#3f3f46";
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.arc(-0.4, -0.5, 1.3, 0, Math.PI);
          ctx.stroke();

          ctx.restore();
        }
      }

      // حلقه نارنجی روی اتصال بالای زنجیرها
      ctx.strokeStyle = "#ff4500";
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.ellipse(hoop.x, rimY, hoop.rimRx, hoop.rimRy, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawPlayerCharacter() {
      var px = playerX();
      var floor = courtFloorY();
      var jumpOff = Math.sin(playerJump * Math.PI) * 18;
      var crouch = isDragging && hasBallInHand ? 4 : 0;
      var y = floor - jumpOff;

      ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
      ctx.beginPath();
      ctx.ellipse(px, floor + 2, 18, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e09f67";
      ctx.fillRect(px - 8, y - 24 + crouch, 6, 18 - crouch);
      ctx.fillRect(px + 2, y - 24 + crouch, 6, 18 - crouch);

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.roundRect(px - 9, y - 7, 10, 7, 3);
      ctx.roundRect(px + 1, y - 7, 11, 7, 3);
      ctx.fill();

      ctx.fillStyle = "#e63946";
      ctx.beginPath();
      ctx.roundRect(px - 10, y - 37 + crouch, 20, 15, 3);
      ctx.fill();

      ctx.fillStyle = "#ffbe0b";
      ctx.beginPath();
      ctx.roundRect(px - 10, y - 60 + crouch, 20, 25, 5);
      ctx.fill();

      var headY = y - 70 + crouch;
      ctx.fillStyle = "#e09f67";
      ctx.beginPath();
      ctx.arc(px, headY, 9.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#161618";
      var curls = [
        [-9, -3, 6], [-7, -9, 7], [0, -11, 7.5], [7, -9, 6.5],
        [-11, 2, 5.5], [-4, -6, 6.5], [3, -6, 6]
      ];
      for (var c = 0; c < curls.length; c++) {
        ctx.beginPath();
        ctx.arc(px + curls[c][0], headY + curls[c][1], curls[c][2], 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = "#e63946";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(px - 8, headY - 4);
      ctx.lineTo(px + 9, headY - 2);
      ctx.stroke();

      ctx.strokeStyle = "#e09f67";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px + 2, y - 54 + crouch);
      if (hasBallInHand) {
        ctx.lineTo(px + 13, y - 55 + crouch);
      } else {
        ctx.lineTo(px + 16, y - 72);
      }
      ctx.stroke();

      if (hasBallInHand) {
        var hp = handPos();
        drawSingleBall(hp.x, hp.y + crouch, 13.5, 0.35);
      }
    }

    function drawSingleBall(x, y, r, rot) {
      ctx.save();
      ctx.translate(x, y);

      var g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
      g.addColorStop(0, "#ff9f1c");
      g.addColorStop(0.55, "#e85d04");
      g.addColorStop(1, "#7f1d08");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, r - 0.5, 0, Math.PI * 2);
      ctx.clip();

      ctx.rotate(rot);

      ctx.strokeStyle = "#260b03";
      ctx.lineWidth = Math.max(1.3, r * 0.11);
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(0, r);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-r, 0);
      ctx.quadraticCurveTo(0, r * 0.18, r, 0);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-r * 0.62, -r * 0.85);
      ctx.quadraticCurveTo(-r * 0.18, 0, -r * 0.62, r * 0.85);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(r * 0.62, -r * 0.85);
      ctx.quadraticCurveTo(r * 0.18, 0, r * 0.62, r * 0.85);
      ctx.stroke();

      ctx.restore();

      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(38, 11, 3, 0.7)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawAimArc() {
      if (!isDragging || !hasBallInHand || Math.hypot(aimVx, aimVy) < 120) return;
      var hp = handPos();
      var gravity = 980;
      var dots = 15;
      for (var i = 1; i <= dots; i++) {
        var t = (aimFlightT * 0.92) * (i / dots);
        var px = hp.x + aimVx * t;
        var py = hp.y + aimVy * t + 0.5 * gravity * t * t;
        var alpha = 0.96 - (i / (dots + 4)) * 0.45;

        ctx.beginPath();
        ctx.arc(px, py, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, " + alpha + ")";
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(35, 10, 15, " + (alpha * 0.65) + ")";
        ctx.stroke();
      }
    }

    function drawPopups() {
      popups.forEach(function(p) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.textAlign = "center";
        for (var i = 0; i < p.lines.length; i++) {
          var isCleanLine = i > 0;
          ctx.font = isCleanLine ? "900 18px Tahoma" : "900 22px Tahoma";
          var ly = p.y + i * 21;
          ctx.strokeStyle = "#111111";
          ctx.lineWidth = 4;
          ctx.strokeText(p.lines[i], p.x, ly);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(p.lines[i], p.x, ly);
        }
        ctx.restore();
      });
    }

    function renderLoop(now) {
      var dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(dt);

      ctx.clearRect(0, 0, W, H);
      drawArenaBackground();
      drawWallScoreboardAndWind();
      drawBackboard();

      // توپ‌های در حال عبور از حلقه پشت زنجیرهای جلویی رسم می‌شوند تا برخورد با زنجیر طبیعی دیده شود
      activeBalls.forEach(function(b) {
        if (b.fallingThroughNet) {
          var scale = Math.max(0.72, 1 - Math.min(b.age / 0.85, 1) * 0.28);
          drawSingleBall(b.x, b.y, b.r * scale, b.rot);
        }
      });

      drawChainsAndRim();
      drawPlayerCharacter();

      activeBalls.forEach(function(b) {
        if (!b.fallingThroughNet) {
          var scale = Math.max(0.72, 1 - Math.min(b.age / 0.85, 1) * 0.28);
          drawSingleBall(b.x, b.y, b.r * scale, b.rot);
        }
      });

      drawAimArc();
      drawPopups();

      requestAnimationFrame(renderLoop);
    }

    function shareRecord() {
      var best = Math.max(score, getLocalBest());
      var gameLink = "https://ble.ir/" + BOT_USERNAME + "?startapp=1";
      var shareText = "🏀 رکورد من در بازی BASKET PRO شد " + best + " امتیاز!\nاگه می‌تونی رکوردمو بزن 👇\n" + gameLink + "\n\nکانال بازی‌ها: " + CHANNEL_ID;
      if (navigator.share) {
        navigator.share({ text: shareText }).catch(function() {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText);
        alert("متن چالش و لینک بازی کپی شد! در چت یا گروه بله پیست کن.");
      }
    }

    resetGame();
    lastTime = performance.now();
    requestAnimationFrame(renderLoop);
  </script>
</body>
